name: RealDiff

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: issacnitin/RealDiff@8aceddcbaa2f0135a517d9deca7cd5a94fa48dad
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REALDIFF_EXCLUDE_NAMESPACES: io.realdiff.demo.sorting
        with:
          gate: warn-only
          post: 'true'
          strict: 'true'
