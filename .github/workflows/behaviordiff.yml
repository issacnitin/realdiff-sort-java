name: BehaviorDiff

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: issacnitin/BehaviorDiff@v0.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BEHAVIORDIFF_EXCLUDE_NAMESPACES: io.behaviordiff.demo.sorting
        with:
          gate: warn-only
          post: 'true'
          strict: 'true'
